# Build and publish the MkDocs site (cosmolattice_private#75).
#
# The deploy job is gated on `main`, and that gate is the whole safety story
# before the Stage C flip:
#
#   * A workflow always runs from the branch that was pushed. This file lives
#     only on `mkdocs-site`, so a push to today's Jekyll `main` does not run it
#     at all -- listing `main` in the trigger below cannot touch the live site.
#   * Once `mkdocs-site` is renamed to `main` at the flip, this file is on the
#     branch Pages will serve and the deploy job starts firing. Nothing here
#     needs editing on the day.
#
# Note a branch rename emits no push event, so after the rename the first
# deployment has to be started by hand with `gh workflow run docs.yml`.
name: docs

on:
  push:
    branches: [mkdocs-site, main]
  workflow_dispatch:

# deploy-pages needs these; the default GITHUB_TOKEN has neither.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two runs race the same deployment. Not cancel-in-progress: an
# interrupted deploy is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build site
        run: bash build.sh

      - name: Check publications list in sync (strict)
        run: tmp/.venv/bin/python scripts/gen_publications.py --check

      - name: Check model registry in sync (strict)
        run: tmp/.venv/bin/python scripts/check_models_registry.py

      # PYTHON must be the venv interpreter. The wrapper defaults to a bare
      # `python3`, which on the runner cannot import yaml -- and that made all
      # four of its checks "fail" identically, in a way indistinguishable from
      # real drift. Because the wrapper always exited 0 and this step was
      # continue-on-error, nobody saw it: the check had never once run.
      #
      # It is strict now. The `dx` lag it used to be excused for is resolved --
      # code and parameters.yaml agree (114 reads across 10 scopes).
      - name: Check parameter database (strict)
        run: PYTHON=tmp/.venv/bin/python bash scripts/check_params_sync.sh --strict

      - name: Assert CNAME, 404, feed and redirect stubs in output
        run: |
          test -f website/site/CNAME
          grep -qx 'cosmolattice.net' website/site/CNAME
          test -f website/site/404.html
          # Frozen copy of the Jekyll RSS feed. Papers and readers may still
          # poll this URL, so it has to survive the flip even though it stopped
          # gaining entries in June 2023.
          test -f website/site/feed.xml
          grep -q '<rss' website/site/feed.xml
          for p in features download documentation usermanual review \
                   technicalnotes school school22material school23 school25 \
                   allversions version10 version11 version12 version13 \
                   people publications tags \
                   2023-06-21-release-v12 2022-09-19-school-material \
                   2022-06-17-bugfix-112 2022-05-05-school \
                   2022-05-05-release-v11; do
            test -f "website/site/$p/index.html" || { echo "missing redirect stub: $p"; exit 1; }
          done
          # Every <link> in the feed must have a stub behind it.
          for u in $(grep -oE '<link>https://cosmolattice\.net/[^<]+</link>' website/site/feed.xml \
                     | sed -E 's|<link>https://cosmolattice\.net/||; s|</link>||; s|/$||'); do
            [ -z "$u" ] && continue
            test -f "website/site/$u/index.html" || { echo "feed link has no target: $u"; exit 1; }
          done

      # Do NOT add a tar step here and do NOT swap this for upload-artifact.
      #
      # This action tars the directory itself and publishes it under the
      # reserved name `github-pages`, which is the only artifact deploy-pages
      # will consume. Packing the site ourselves first would still deploy
      # green -- and would serve a site whose entire content is one file named
      # site.tar.gz.
      #
      # The tar is also why the colon in `Manual/HDF5: Output and Backups.html`
      # is fine here, where upload-artifact used to reject it file-by-file.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    # The live site is only ever published from `main`. On `mkdocs-site` the
    # build above still runs, so prep pushes keep their checks, but nothing
    # reaches production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
